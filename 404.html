        <a href="index.html" class="nav-icon" aria-label="visit homepage">
            <img src="img/logo_new.jpg" alt="chat icon">
            <span>Havila</span>
        </a>
        <div class="main-navlinks">
            <button class="hamburger" type="button" aria-label="Toggle navigation">
          <span></span><span></span><span></span>
        </button>
            <div class="navlinks-container">
                <a href="index.html" target="_blank">Acceuil</a>

<main>
    <div class="music-header">
        <img src="img/music_logo.jpg" alt="Havila Music" class="music-header-img">
        <div class="music-header-text">
            <h1>Havila Music</h1>
            <p>Vous êtes sur la playlist d’Havila Music !</p>
        </div>
    </div>
    
    <div class="playlist-container">
        <h2>Titres disponibles</h2>
        <ul id="playlist" class="playlist">
            <!-- La liste sera générée dynamiquement via JS -->
        </ul>
    </div>
</main>

<div class="player-bar">
    <div class="player-info">
        <img src="img/music_logo.jpg" alt="Cover" id="now-playing-img">
        <div class="player-details">
            <div id="now-playing-title">Sélectionnez un titre</div>
            <div id="now-playing-artist">Havila Music <span id="play-count" title="Nombre de lectures">▶ 0</span></div>
        </div>
    </div>
    <div class="player-controls">
        <button id="prev-btn" class="ctrl-btn">⏮</button>
        <button id="play-btn" class="ctrl-btn play-pause">▶</button>
        <button id="next-btn" class="ctrl-btn">⏭</button>
    </div>
    <div class="player-progress">
        <span id="current-time">0:00</span>
        <input type="range" id="seek-slider" min="0" max="100" value="0">
        <span id="duration">0:00</span>
    </div>
    <audio id="audio-player"></audio>
</div>
